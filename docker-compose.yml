services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memeswipe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memeswipe"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/memeswipe
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
